[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-automation-skill"
version = "0.1.0"
description = "AI Skill + MCP toolkit for agent-driven headless Blender modelling: parameter search, quantified scoring and self-iteration loops"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "LUgABeEEE", email = "LUgABeEEE@users.noreply.github.com" }]
keywords = ["blender", "headless", "3d-modeling", "mcp", "model-context-protocol", "ai-agent", "agent-tools", "tool-calling", "automation", "closed-loop", "optimization", "silhouette"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "build>=1.2",
  "twine>=5.0",
  "pre-commit>=3.7",
  "mcp>=1.9",
]

[project.scripts]
blender-automation-skill = "model_loop.cli:main"
model-loop = "model_loop.cli:main"
blender-automation-skill-mcp = "model_loop.mcp_server:main"

[project.urls]
Homepage = "https://github.com/LUgABeEEE/blender-automation-skill"
Issues = "https://github.com/LUgABeEEE/blender-automation-skill/issues"
Changelog = "https://github.com/LUgABeEEE/blender-automation-skill/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561 marker: ship the inline annotations so type checkers (mypy, pyright)
# treat model_loop as a typed package instead of "Any".
[tool.setuptools.package-data]
model_loop = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["model_loop"]
branch = true

[tool.coverage.report]
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
