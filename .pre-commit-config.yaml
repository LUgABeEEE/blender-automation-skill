# Local fast checks that mirror CI. CI remains the source of truth; these hooks
# just keep a broken commit from being pushed in the first place.
#
#   python -m pip install -e ".[dev]"
#   pre-commit install
#   pre-commit run --all-files
#
# The ruff hooks are pinned to the same version as the dev extra so local and CI
# rules cannot drift; bump both together with `.pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      # ruff also formats the Python blocks inside Markdown, which is exactly
      # what `ruff format --check .` enforces in CI; keep the hook in sync.
      - id: ruff-format
        types_or: [python, pyi, markdown]
