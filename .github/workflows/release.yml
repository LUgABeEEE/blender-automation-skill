# Release pipeline: tag -> sdist + wheel -> twine check -> (PyPI) -> GitHub Release.
#
# Publishing to PyPI uses Trusted Publishing (OIDC): there is NO API token and no
# PYPI_API_TOKEN secret anywhere in this workflow. The short-lived identity token
# comes from GitHub, and PyPI verifies it against the publisher configured below.
#
# ---- One-time setup, PyPI side (a maintainer does this once) ----------------
#   1. pypi.org -> "Publishing" -> "Add a new pending publisher" (new project) or
#      pypi.org -> <project> -> "Publishing" -> "Add a trusted publisher" (existing
#      project). The fields must match this file EXACTLY:
#         PyPI Project Name : blender-automation-skill
#         Owner             : LUgABeEEE
#         Repository name   : blender-automation-skill
#         Workflow name     : release.yml
#         Environment name  : pypi
#   2. GitHub -> repo Settings -> Environments -> new environment "pypi".
#      Add required reviewers if a release should need a human approval step;
#      the publish job waits on that environment either way.
#   3. Do not create a PyPI API token for this repo. If one was created for the
#      old manual upload flow, revoke it.
#   Note: the first publish creates the project on PyPI; after that the pending
#   publisher becomes a regular trusted publisher automatically.
#
# ---- Why the PyPI job is gated ---------------------------------------------
#   The trusted publisher lives on pypi.org and cannot be created from this
#   repository, so a tag pushed before that setup would otherwise fail the whole
#   run and skip the GitHub Release. `publish` therefore only runs when the
#   repository variable PYPI_PUBLISH is "true":
#
#       gh variable set PYPI_PUBLISH --body true
#       gh workflow run release.yml --ref v0.1.0   # re-run for an existing tag
#
#   The GitHub Release job does not depend on PyPI: it always ships the built
#   distributions and is safe to re-run (it uploads into an existing release).
#
# ---- Cutting a release ------------------------------------------------------
#   1. bump "version" in pyproject.toml (single source of truth) and add a
#      CHANGELOG entry
#   2. commit and push to main
#   3. git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#   The build job fails early if the tag does not match the pyproject version.
#   Re-running a failed tag push is safe: PyPI rejects duplicate uploads, so
#   bump the version instead of re-tagging the same one.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check that the tag matches the pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match pyproject version v$version" >&2
            exit 1
          fi
          echo "tag and version agree: $TAG"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "twine>=5.0"
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --upgrade pip > /dev/null
          /tmp/wheelcheck/bin/python -m pip install dist/*.whl > /dev/null
          /tmp/wheelcheck/bin/blender-automation-skill --version
          /tmp/wheelcheck/bin/blender-automation-skill version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish (PyPI trusted publishing)
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/blender-automation-skill
    permissions:
      id-token: write # the OIDC token PyPI exchanges for an upload credential
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Intentionally no "password:" - trusted publishing must not fall back
        # to a secret, or PyPI cannot tell the two flows apart.

  github-release:
    name: github release (attach artifacts)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create needs to write release notes
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create or update the GitHub release with the built distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; uploading assets"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "blender-automation-skill $GITHUB_REF_NAME" \
              --generate-notes
          fi
